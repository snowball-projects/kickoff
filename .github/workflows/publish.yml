name: Publish calendar
on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Check Python
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pytest
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Install browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Test browser behavior
        run: npm --prefix frontend run test:browser
      - name: Fetch every schedule
        run: python scripts/refresh-public.py --warnings "$RUNNER_TEMP/feed-failures.md"
      - name: Build site
        run: npm --prefix frontend run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: frontend/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - name: Report feed failures after deployment
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/feed-failures.md" ]; then
            echo "## Failed schedule feeds" >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/feed-failures.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
