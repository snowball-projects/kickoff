name: Rehearse checked schedule updates

# Candidate refresh path: one data-only PR, explicitly dispatched CI, then a
# normal checked merge and explicit Pages dispatch. No direct main push or bypass.
# Feed problems keep the previous data and open an issue instead of publishing gaps.
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the PR/check path without merging or publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - name: Prepare the reusable refresh branch
        run: python scripts/stage-refresh.py prepare
      - name: Fetch schedules
        run: python scripts/refresh-public.py --warnings "$RUNNER_TEMP/warnings.md"
      - name: Validate public snapshots
        run: node scripts/prepare-web.mjs
      - name: Publish through a checked pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_STATUS_PATH: ${{ runner.temp }}/refresh-publication-status.md
        run: python scripts/stage-refresh.py publish ${{ inputs.verify_only && '--verify-only' || '' }}
      - name: Report warnings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/warnings.md" ]; then exit 0; fi
          body="$(printf 'The [weekly refresh](%s/%s/actions/runs/%s) kept previous data for:\n\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"; cat "$RUNNER_TEMP/warnings.md")"
          open="$(gh issue list --state open --search 'in:title "Schedule refresh warnings"' --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Schedule refresh warnings" --body "$body"
          fi
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_STATUS_PATH: ${{ runner.temp }}/refresh-publication-status.md
        run: |
          {
            printf 'The [checked refresh](%s/%s/actions/runs/%s) failed.\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            if [ -s "$REFRESH_STATUS_PATH" ]; then
              cat "$REFRESH_STATUS_PATH"
            else
              printf 'No publication stage was recorded; inspect the run before retrying.\n'
            fi
            printf '\nFailure does not establish whether main merged or Pages published. A no-change refresh does not retry publication.\n'
            printf '\nFollow the [bounded operator recovery procedure](%s/%s/blob/main/docs/OPERATIONS.md#recover-a-checked-merge-without-confirmed-publication).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY"
          } > "$RUNNER_TEMP/refresh-failure.md"
          gh issue create --title "Schedule refresh failed" \
            --body-file "$RUNNER_TEMP/refresh-failure.md"
