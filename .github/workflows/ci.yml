name: CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Check Python
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m pytest
      - name: Test frontend
        run: npm --prefix frontend test
      - name: Install browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Test browser behavior
        run: npm --prefix frontend run test:browser
      - name: Build frontend with test data
        run: npm --prefix frontend run build
