name: CI

# Main publishes through pages.yml, which retains code tests and both builds.
on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.changes.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          app=false
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            app=true
          else
            git diff --name-only -z "$BASE" "$HEAD" > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' path; do
              case "$path" in
                data/*|docs/sources/*|CHANGELOG.md) : ;;
                *) app=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - name: Validate reviewed registries
        env:
          PYTHONPATH: src
        run: |
          python - <<'CHECK'
          from pathlib import Path
          from kickoff.reviewed_schedules import load_reviewed_schedules
          directory = Path("data/reviewed")
          years = {int(path.name.split("-", 1)[0]) for path in directory.glob("*.json")}
          for year in sorted(years):
              load_reviewed_schedules(directory, int(year))
          CHECK
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate published snapshots and pinned references
        run: node scripts/prepare-web.mjs
      - if: steps.changes.outputs.app == 'true'
        name: Lint
        run: python -m ruff check src tests scripts
      - if: steps.changes.outputs.app == 'true'
        name: Check formatting
        run: python -m ruff format --check src tests scripts
      - if: steps.changes.outputs.app == 'true'
        name: Test
        run: python -m pytest
      - if: steps.changes.outputs.app == 'true'
        name: Build package
        run: python -m build --no-isolation

  frontend:
    needs: python
    if: needs.python.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test calendar navigation in browser
        run: npm run test:browser
      - name: Save browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
      - name: Build frontend
        run: npm run build
